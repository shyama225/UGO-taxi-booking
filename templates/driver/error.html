<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
{% extends 'base.html' %}

{% block content %}
<nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(135deg, #2563eb, #1d4ed8);">
    <div class="container-fluid">
        <a class="navbar-brand" href="#"><i class="fas fa-car-side me-2"></i>UGo Driver</a>
    </div>
</nav>

<div class="p-4" style="background: linear-gradient(135deg, #f0f9ff, #e0f2fe); min-height: calc(100vh - 56px);">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm text-center">
                <div class="card-body py-5">
                    <div class="mb-4">
                        <div class="bg-danger rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 100px; height: 100px;">
                            <i class="fas fa-exclamation-triangle text-white fa-3x"></i>
                        </div>
                        <h4 class="fw-bold text-danger">Action Required</h4>
                        <p class="text-muted">{{ message }}</p>
                    </div>
                    
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'driver_subscription_plans' %}" class="btn btn-primary">
                            <i class="fas fa-credit-card me-2"></i>Subscribe Now
                        </a>
                        <a href="{% url 'driver_dashboard' %}" class="btn btn-outline-secondary">
                            <i class="fas fa-home me-2"></i>Go to Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
