<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<div class="col-md-3 col-lg-2 sidebar p-3">
    <div class="text-center mb-4 pb-3 border-bottom border-secondary">
        <a href="{% url 'user_dashboard' %}" class="text-white text-decoration-none">
            <h3 class="fw-bold"><i class="fas fa-car-side me-2"></i>UGo</h3>
            <small class="text-secondary">User Panel</small>
        </a>
    </div>
    
    <nav class="nav flex-column">
        <a href="{% url 'user_dashboard' %}" class="sidebar-link {% if request.resolver_match.url_name == 'user_dashboard' %}active{% endif %}">
            <i class="fas fa-home"></i> Dashboard
        </a>
        <a href="{% url 'user_request_ride' %}" class="sidebar-link {% if 'request_ride' in request.path %}active{% endif %}">
            <i class="fas fa-taxi"></i> Request Ride
        </a>
        <a href="{% url 'user_ride_history' %}" class="sidebar-link {% if 'ride_history' in request.path %}active{% endif %}">
            <i class="fas fa-history"></i> Ride History
        </a>
        <a href="{% url 'user_profile' %}" class="sidebar-link {% if 'profile' in request.path %}active{% endif %}">
            <i class="fas fa-user-cog"></i> My Profile
        </a>
    </nav>
    
    <div class="mt-auto pt-3 border-top border-secondary">
        <a href="{% url 'logout' %}" class="sidebar-link text-danger">
            <i class="fas fa-sign-out-alt"></i> Logout
        </a>
    </div>
</div>
