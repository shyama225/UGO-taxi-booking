<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
{% extends 'base.html' %}

{% block content %}
<nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(135deg, #2563eb, #1d4ed8);">
    <div class="container-fluid">
        <a class="navbar-brand" href="#"><i class="fas fa-car-side me-2"></i>UGo Driver</a>
    </div>
</nav>

<div class="p-4" style="background: linear-gradient(135deg, #f0f9ff, #e0f2fe); min-height: calc(100vh - 56px);">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold"><i class="fas fa-key me-2"></i>Verify OTP</h2>
        <a href="{% url 'driver_dashboard' %}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i>Back
        </a>
    </div>
    
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-body text-center">
                    <div class="mb-4">
                        <div class="bg-primary rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 100px; height: 100px;">
                            <i class="fas fa-key text-white fa-3x"></i>
                        </div>
                        <h4 class="fw-bold">Enter OTP</h4>
                        <p class="text-muted">Ask the rider for their OTP code</p>
                    </div>
                    
                    {% if error %}
                    <div class="alert alert-danger mb-4">
                        <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
                    </div>
                    {% endif %}
                    
                    <div class="card bg-light mb-4">
                        <div class="card-body">
                            <p class="mb-2"><strong>Rider:</strong> {{ ride.rider.username }}</p>
                            <p class="mb-0"><strong>Pickup:</strong> {{ ride.pickup_location }}</p>
                        </div>
                    </div>
                    
                    <!-- <form method="POST">
                        {% csrf_token %} -->
                        <form method="POST" action="{% url 'driver_verify_otp' ride.id %}">
                        {% csrf_token %}
                        <div class="mb-4">
                            <input type="text" class="form-control text-center fs-1 letter-spacing-3" 
                                   name="otp" maxlength="4" pattern="[0-9]{4}" 
                                   placeholder="____" style="letter-spacing: 10px; font-size: 2rem;" required>
                        </div>
                        <form method="POST">
                       {% csrf_token %}
                        <button type="submit" class="btn btn-primary btn-lg w-100">
                            <i class="fas fa-check-circle me-2"></i>Start Ride
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.letter-spacing-3 {
    letter-spacing: 0.5em;
    font-family: monospace;
}
input[type="text"]:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}
</style>

<script>
document.querySelector('input[name="otp"]').addEventListener('input', function(e) {
    this.value = this.value.replace(/[^0-9]/g, '');
});
</script>
{% endblock %}
