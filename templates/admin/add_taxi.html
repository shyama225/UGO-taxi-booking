{% extends 'base.html' %}

{% block content %}
<div class="p-4 min-vh-100" style="background: #f8fafc;">
    <div class="mb-5 text-center">
        <nav aria-label="breadcrumb" class="d-flex justify-content-center">
            <ol class="breadcrumb">
                <li class="breadcrumb-item small fw-bold text-uppercase"><a href="{% url 'admin_manage_taxis' %}" class="text-decoration-none text-primary">Vehicles</a></li>
                <li class="breadcrumb-item active small fw-bold text-uppercase" aria-current="page">Registration</li>
            </ol>
        </nav>
        <h1 class="fw-bold text-dark mb-1" style="font-size: 1.75rem;">Vehicle Registration</h1>
        <p class="text-muted mb-0">Onboard a new vehicle and link it to an existing driver profile.</p>
    </div>
    
    <div class="card border-0 shadow-lg mx-auto" style="border-radius: 20px; max-width: 650px;">
        <div class="card-body p-4">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
            <form method="POST">
                {% csrf_token %}
                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-uppercase text-muted">Assigned Driver</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="fas fa-id-card text-muted small"></i></span>
                            <select class="form-select bg-light border-0" name="driver_id" required>
                                <option value="">Select a driver</option>
                                {% for driver in drivers %}
                                <option value="{{ driver.id }}">{{ driver.username }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-uppercase text-muted">Vehicle Model</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="fas fa-car-side text-muted small"></i></span>
                            <input type="text" class="form-control bg-light border-0" name="model_name" placeholder="e.g. Toyota Camry" required>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-uppercase text-muted">Plate Number</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="fas fa-barcode text-muted small"></i></span>
                            <input type="text" class="form-control bg-light border-0" name="plate_number" placeholder="e.g. MH-12-AX-1234" required>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-uppercase text-muted">Taxi Segment</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="fas fa-layer-group text-muted small"></i></span>
                            <select class="form-select bg-light border-0" name="taxi_type" required>
                                <option value="sedan">Premium Sedan</option>
                                <option value="suv">Grand SUV</option>
                                <option value="hatchback">Mini / City</option>
                                <option value="luxury">Luxury Elite</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-uppercase text-muted">Passenger Capacity</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="fas fa-users text-muted small"></i></span>
                            <input type="number" class="form-control bg-light border-0" name="capacity" value="4" required>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-uppercase text-muted">Exterior Color</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="fas fa-palette text-muted small"></i></span>
                            <input type="text" class="form-control bg-light border-0" name="color" placeholder="e.g. White" required>
                        </div>
                    </div>
                </div>
                
                <hr class="my-4 opacity-10">
                
                <div class="d-flex justify-content-end gap-3">
                    <a href="{% url 'admin_manage_taxis' %}" class="btn btn-light px-4 rounded-3 fw-bold">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4 rounded-3 fw-bold shadow-sm">
                        <i class="fas fa-check-circle me-2"></i>Complete Registration
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
