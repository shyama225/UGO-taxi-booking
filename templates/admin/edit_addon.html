{% extends 'base.html' %}

{% block content %}
<div class="p-4 min-vh-100" style="background: #f8fafc;">
    <div class="mb-5">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item small fw-bold text-uppercase"><a href="{% url 'admin_manage_addons' %}" class="text-decoration-none">Add-Ons</a></li>
                <li class="breadcrumb-item active small fw-bold text-uppercase" aria-current="page">Modification</li>
            </ol>
        </nav>
        <h1 class="fw-bold text-slate-800 mb-1" style="font-size: 1.75rem;">Modify Package: {{ addon.name }}</h1>
        <p class="text-muted mb-0">Adjust pricing and benefit parameters for this existing ride boost package.</p>
    </div>
    
    <div class="card border-0 shadow-sm" style="border-radius: 24px; max-width: 800px;">
        <div class="card-body p-5">
            <form action="{% url 'admin_edit_addon' addon.id %}" method="POST">
                {% csrf_token %}
                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-uppercase text-muted">Package Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="fas fa-edit text-muted small"></i></span>
                            <input type="text" name="name" value="{{ addon.name }}" class="form-control bg-light border-0" required>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-uppercase text-muted">Purchase Price (₹)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0">₹</span>
                            <input type="number" name="price" value="{{ addon.price }}" step="0.01" class="form-control bg-light border-0" required>
                        </div>
                    </div>
                    

                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-uppercase text-muted">Bonus KM Quota</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="fas fa-road text-muted small"></i></span>
                            <input type="number" name="km_limit" value="{{ addon.km_limit }}" class="form-control bg-light border-0" min="0" required>
                            <span class="input-group-text bg-light border-0 text-muted small">km</span>
                        </div>
                        <div class="form-text text-muted">Extra kilometers added on top of daily limit</div>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-uppercase text-muted">Expiration (Days)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="fas fa-clock text-muted small"></i></span>
                            <input type="number" name="validity_days" value="{{ addon.validity_days }}" min="1" class="form-control bg-light border-0" required>
                        </div>
                    </div>
                    
                    <div class="col-12">
                        <label class="form-label small fw-bold text-uppercase text-muted">Marketing Copy</label>
                        <textarea name="description" rows="3" class="form-control bg-light border-0">{{ addon.description }}</textarea>
                    </div>
                    
                    <div class="col-12">
                        <div class="bg-light p-3 rounded-4 d-flex align-items-center justify-content-between">
                            <div class="d-flex align-items-center gap-3">
                                <div class="bg-white p-2 rounded-circle shadow-sm">
                                    <i class="fas fa-eye text-primary small"></i>
                                </div>
                                <label for="is_active" class="fw-bold text-dark small mb-0 cursor-pointer">Live in Marketplace</label>
                            </div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" name="is_active" id="is_active" {% if addon.is_active %}checked{% endif %} style="width: 45px; height: 24px;">
                            </div>
                        </div>
                    </div>
                </div>
                
                <hr class="my-5 opacity-10">
                
                <div class="d-flex justify-content-end gap-3">
                    <a href="{% url 'admin_manage_addons' %}" class="btn btn-light px-4 rounded-3 fw-bold">Discard</a>
                    <button type="submit" class="btn btn-primary px-4 rounded-3 fw-bold shadow-sm">
                        <i class="fas fa-save me-2"></i>Apply Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
