{% extends 'base.html' %}

{% block content %}
<div class="p-4 min-vh-100" style="background: #f8fafc;">
    <div class="mb-5 text-center">
        <nav aria-label="breadcrumb" class="d-flex justify-content-center">
            <ol class="breadcrumb">
                <li class="breadcrumb-item small fw-bold text-uppercase"><a href="{% url 'admin_manage_pricing' %}" class="text-decoration-none text-primary">Fare Logic</a></li>
                <li class="breadcrumb-item active small fw-bold text-uppercase" aria-current="page">Configuration</li>
            </ol>
        </nav>
        <h1 class="fw-bold text-dark mb-1" style="font-size: 1.75rem;">Add Pricing</h1>
        <p class="text-muted mb-0">Define the mathematical logic for fare estimation and driver earnings.</p>
    </div>
    
    <div class="card border-0 shadow-lg mx-auto" style="border-radius: 20px; max-width: 650px;">
        <div class="card-body p-4">
            <form method="POST">
                {% csrf_token %}
                <div class="row g-4">
                    <div class="col-12 mb-2">
                        <label class="form-label small fw-bold text-uppercase text-muted">Plan Identifier</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="fas fa-tag text-muted small"></i></span>
                            <input type="text" class="form-control bg-light border-0" name="name" placeholder="e.g. Surge Pricing / Night Rate" required>
                        </div>
                    </div>
                    
                    <div class="col-md-4">
                        <label class="form-label small fw-bold text-uppercase text-muted">Base Fare (₹)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0">₹</span>
                            <input type="number" step="0.01" class="form-control bg-light border-0" name="base_fare" placeholder="50.00" required>
                        </div>
                    </div>
                    
                    <div class="col-md-4">
                        <label class="form-label small fw-bold text-uppercase text-muted">Rate / KM (₹)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0">₹</span>
                            <input type="number" step="0.01" class="form-control bg-light border-0" name="per_km_rate" placeholder="12.00" required>
                        </div>
                    </div>
                    
                    <div class="col-md-4">
                        <label class="form-label small fw-bold text-uppercase text-muted">Rate / Minute (₹)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0">₹</span>
                            <input type="number" step="0.01" class="form-control bg-light border-0" name="per_minute_rate" placeholder="1.00" required>
                        </div>
                    </div>
                </div>
                
                <hr class="my-5 opacity-10">
                
                <div class="d-flex justify-content-end gap-3">
                    <a href="{% url 'admin_manage_pricing' %}" class="btn btn-light px-4 rounded-3 fw-bold">Discard</a>
                    <button type="submit" class="btn btn-primary px-4 rounded-3 fw-bold shadow-sm">
                        <i class="fas fa-save me-2"></i>Save Pricing
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
