{% extends 'base.html' %}

{% block content %}
<div class="p-4 min-vh-100" style="background: #f8fafc;">
    <div class="mb-5 text-center">
        <nav aria-label="breadcrumb" class="d-flex justify-content-center">
            <ol class="breadcrumb">
                <li class="breadcrumb-item small fw-bold text-uppercase"><a href="{% url 'admin_manage_subscriptions' %}" class="text-decoration-none text-primary">Partnership Plans</a></li>
                <li class="breadcrumb-item active small fw-bold text-uppercase" aria-current="page">Creation</li>
            </ol>
        </nav>
        <h1 class="fw-bold text-dark mb-1" style="font-size: 1.75rem;">Premium Tier Creation</h1>
        <p class="text-muted mb-0">Design a new partnership tier for drivers with specific access quotas.</p>
    </div>
    
    <div class="card border-0 shadow-lg mx-auto" style="border-radius: 20px; max-width: 600px;">
        <div class="card-body p-4">
            <form method="POST">
                {% csrf_token %}
                <div class="row g-4">
                    <div class="col-md-8">
                        <label class="form-label small fw-bold text-uppercase text-muted">Tier Heading</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="fas fa-crown text-muted small"></i></span>
                            <input type="text" class="form-control bg-light border-0" name="name" placeholder="e.g. Platinum Partner / Weekend Warrior" required>
                        </div>
                    </div>
                    
                    <div class="col-md-4">
                        <label class="form-label small fw-bold text-uppercase text-muted">Renewal Cycle</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="fas fa-sync-alt text-muted small"></i></span>
                            <select class="form-select bg-light border-0" name="duration_type" required>
                                <option value="daily">Every 24 Hours</option>
                                <option value="weekly">Every 7 Days</option>
                                <option value="monthly">Monthly Cycle</option>
                                <option value="yearly">Annual Pass</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-uppercase text-muted">Retail Price (₹)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0">₹</span>
                            <input type="number" step="0.01" class="form-control bg-light border-0" name="price" placeholder="499.00" required>
                        </div>
                    </div>
                    

                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-uppercase text-muted">Daily KM Limit</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="fas fa-road text-muted small"></i></span>
                            <input type="number" class="form-control bg-light border-0" name="daily_km_limit" placeholder="100" required>
                        </div>
                        <div class="form-text small opacity-50">Kilometers allowed per day.</div>
                    </div>

                    
                    <div class="col-12">
                        <label class="form-label small fw-bold text-uppercase text-muted">Marketplace Description</label>
                        <textarea class="form-control bg-light border-0" name="description" rows="3" placeholder="Highlight the key benefits of this partnership tier for drivers..."></textarea>
                    </div>
                </div>
                
                <hr class="my-4 opacity-10">
                
                <div class="d-flex justify-content-end gap-3">
                    <a href="{% url 'admin_manage_subscriptions' %}" class="btn btn-light px-4 rounded-3 fw-bold">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4 rounded-3 fw-bold shadow-sm">
                        <i class="fas fa-plus-circle me-2"></i>Launch Tier
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
